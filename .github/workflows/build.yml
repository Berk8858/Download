name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.22.0 yt-dlp
      
      - name: Download ffmpeg
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg"
          Copy-Item "ffmpeg\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe" -Destination "."
      
      - name: Download yt-dlp.exe
        run: |
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "yt-dlp.exe"
      
      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build EXE
        run: |
          python -m PyInstaller --onefile --noconsole --name "Multi-Downloader-${{ steps.version.outputs.VERSION }}" --icon download-icon.ico --add-data "yt-dlp.exe;." --add-data "ffmpeg.exe;." --hidden-import yt_dlp --collect-submodules yt_dlp --clean --noconfirm twitter-indirici.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Multi-Downloader-${{ steps.version.outputs.VERSION }}
          path: dist/Multi-Downloader-${{ steps.version.outputs.VERSION }}.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Multi-Downloader-${{ steps.version.outputs.VERSION }}.exe
          draft: false
          prerelease: false
